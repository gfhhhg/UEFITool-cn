name: Build Windows 32bit Static EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Static Qt 5.6.3 (Win32)
        uses: actions/checkout@v4
        with:
          repository: LongSoft/qt-5.6.3-static-x86-msvc2017
          path: qt5
          lfs: true

      - name: Extract Qt
        shell: bash
        run: |
          7z x qt5/qt-5.6.3-static-x86-msvc2017.7z -o../

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A Win32 -T v141_xp `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/../qt-5.6.3-static-x86-msvc2017" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"

      - name: Build Release
        run: |
          cmake --build build --config Release -j 4

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UEFITool-Win32-Static
          path: |
            build/UEFITool/Release/UEFITool.exe
            build/UEFIExtract/Release/UEFIExtract.exe
            build/UEFIFind/Release/UEFIFind.exe
